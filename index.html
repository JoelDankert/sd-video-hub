<!doctype html><html lang=de><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>SD Video Vault</title><style>:root{--bg:#101112;--panel:#191a1c;--panel2:#222326;--line:#5c5549;--text:#eee9dd;--muted:#9f998e;--gold:#d6a849;--green:#61c386;--red:#dc6b5f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#393022 0,#101112 35%),var(--bg);color:var(--text);font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;word-break:keep-all;overflow-wrap:normal;hyphens:none}header{border-bottom:1px solid var(--line);background:#171819e8;backdrop-filter:blur(8px);padding:24px clamp(18px,5vw,70px);display:flex;align-items:end;justify-content:space-between;gap:20px}h1{margin:0;font:700 clamp(25px,4vw,44px)/1 Arial,sans-serif;letter-spacing:.02em}h1:before{content:'◆ ';color:var(--gold)}.sub{color:var(--muted);margin-top:8px}.wrap{max-width:1400px;margin:auto;padding:24px clamp(18px,5vw,70px)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:9px 12px;font:inherit}.select:focus,button:focus{outline:2px solid var(--gold)}button{cursor:pointer}button:hover{border-color:var(--gold);color:#fff}.card{background:linear-gradient(145deg,#202124,#171819);border:1px solid var(--line);box-shadow:0 8px 30px #0005;padding:16px;margin-bottom:16px}.phase{display:grid;grid-template-columns:170px 1fr 110px;gap:12px;align-items:center;margin:10px 0}.phase-label{color:var(--muted)}.bar{height:9px;background:#37352f;border:1px solid #514a3d;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#9d7424,var(--gold));transition:width .3s}.fill.green{background:linear-gradient(90deg,#32845d,var(--green))}.fill.blue{background:linear-gradient(90deg,#245a9d,#5fa9ff)}.fill.red{background:var(--red)}.stream-controls{display:flex;gap:7px;flex-wrap:nowra </style><header><div><h1>SD Video Vault</h1></div></header><main class=wrap><section id=transfers></section><section class=stream-controls><label class=stream-option><input id=skip-toggle type=checkbox checked> Nicht-Flug überspringen</label><label class=stream-option><input id=crop-toggle type=checkbox> Crop 4:3</label></section><div class=toolbar><div><b>Archiv</b> <span id=count class=sub></span></div></div><section id=gallery class=gallery></section></main><div id=viewer class=viewer hidden><div class=viewer-box><video id=viewer-video controls playsinline></video></div></div><script>let state={files:[]},lastGalleryKey='',skipMap={},skipMapLoaded=false,activeSkips=[],viewerHistory=false;const SKIP_MAP_URL='/media/'+encodeURIComponent(__SDH_CUTLIST__),player=document.getElementById('viewer-video'),skipToggle=document.getElementById('skip-toggle'),cropToggle=document.getElementById('crop-toggle'),viewer=document.getElementById('viewer');let skipPreferenceSaved=false,cropPreferenceSaved=false,playbackDefaultsApplied=false;try{const skip=localStorage.getItem('sd-video-hub.skip-nonflight.v1'),crop=localStorage.getItem('sd-video-hub.crop-4-3.v1');skipPreferenceSaved=skip!==null;cropPreferenceSaved=crop!==null;skipToggle.checked=skip!=='false';cropToggle.checked=crop==='true'}catch{}let currentUrl='';const fmt=n=>{n=Number(n||0);return n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':Math.round(n/1e3)+' KB'};const dur=s=>{s=Math.round(Number(s||0));return s?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'—'};const pct=(a,b)=>b?Math.min(100,Math.round(a/b*100)):0;const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const flightDownloads=new Map();function syncFlightDownloads(){document.querySelectorAll('button[data-flight-id]').forEach(button=>{const job=flightDownloads.get(button.dataset.flightId),file=(state.files||[]).find(f=>String(f.id)===button.dataset.flightId);button.disabled=!!job||!file||file.flight_duration==null;button.textContent=job?job.label:'Nur Flugzeit'})}async function flightDownload(button){const id=button.dataset.flightId,file=(state.files||[]).find(f=>String(f.id)===id);if(button.disabled||flightDownloads.has(id)||!file||file.flight_duration==null)return;const job={label:'Wird vorbereitet …'};flightDownloads.set(id,job);syncFlightDownloads();try{const request=async(url,options)=>{const response=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});const result=await response.json();if(!response.ok)throw new Error(result.error||'Download konnte nicht vorbereitet werden ('+response.status+').');return result};let result=await request('/api/flight-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:file.id})}),token=result.token;for(;;){if(result.state==='error'||result.error)throw new Error(result.error||'Flugschnitt fehlgeschlagen.');if(result.state==='expired')throw new Error('Download abgelaufen. Bitte erneut versuchen.');if(result.state==='delivered')break;if(result.state==='ready'){if(!token)throw new Error('Download-Token fehlt.');const url=new URL(result.url||'/flight-download/'+encodeURIComponent(token),location.origin);if(url.origin!==location.origin||!url.pathname.startsWith('/flight-download/'))throw new Error('Ungültige Download-Adresse.');const link=document.createElement('a');link.href=url.href;link.download='';document.body.appendChild(link);link.click();link.remove();break}if(!token||!['queued','rendering'].includes(result.state))throw new Error('Ungültiger Download-Status.');const progress=Number(result.progress);job.label=result.state==='queued'?'In Warteschlange …':'Flugschnitt'+(result.progress!=null&&Number.isFinite(progress)?' · '+Math.max(0,Math.min(100,Math.round(progress)))+'%':' …');syncFlightDownloads();await new Promise(resolve=>setTimeout(resolve,1500));result=await request('/api/flight-download/'+encodeURIComponent(token))}}catch(error){alert(error.message||'Download fehlgeschlagen.')}finally{flightDownloads.delete(id);syncFlightDownloads()}}function transfer(s,files){let own=files.filter(f=>f.session===s.id),done=own.filter(f=>f.status==='done'),copy=pct(s.copied_bytes,s.total_bytes),comp=own.length?Math.round(own.reduce((a,f)=>a+Number(f.compress_progress||0),0)/own.length):0,processed=done.reduce((a,f)=>a+Number(f.size||0),0),produced=done.reduce((a,f)=>a+Number(f.output_size||0),0),saved=processed&&produced?Math.round((1-produced/processed)*100):null,cutFiles=own.filter(f=>f.status==='done'),cutDone=cutFiles.filter(f=>f.cut_status==='done').length,cut=cutFiles.length?Math.round(cutFiles.reduce((a,f)=>a+Number(f.cut_progress||0),0)/cutFiles.length):0;return `<div class=card><b>${s.label}</b><div class=phase><span class=phase-label>1 · Kopieren</span><div><div class=bar><div class=fill style="width:${copy}%"></div></div><small>${fmt(s.copied_bytes)} / ${fmt(s.total_bytes)}</small></div><strong>${copy}%</strong></div><div class=phase><span class=phase-label>2 · Komprimieren</span><div><div class=bar><div class="fill green" style="width:${comp}%"></div></div><small>${fmt(processed)} / ${fmt(s.video_bytes)}${saved!==null?` · ${saved}% kleiner`:''}</small></div><strong>${comp}%</strong></div><div class=phase><span class=phase-label>3 · Flugschnitt</span><div><div class=bar><div class="fill blue" style="width:${cut}%"></div></div><small>${cutDone} / ${cutFiles.length} Videos</small></div><strong>${cut}%</strong></div><div class=details>Status: ${s.status} · ${own.length} Videos</div></div>`}function render(){let files=state.files||[],sessions=state.sessions||[],hasSd=(state.devices||[]).some(d=>d.state==='mounted'||d.state==='detected'),allComplete=sessions.every(s=>s.status==='done');transfers.innerHTML=!hasSd&&allComplete?'':sessions.map(s=>transfer(s,files)).join('')||`<div class=card><b>Bereit</b><div class=phase><span class=phase-label>1 · Kopieren</span><div class=bar><div class=fill style="width:0%"></div></div><strong>0%</strong></div><div class=phase><span class=phase-label>2 · Komprimieren</span><div class=bar><div class="fill green" style="width:0%"></div></div><strong>0%</strong></div><div class=phase><span class=phase-label>3 · Flugschnitt</span><div><div class=bar><div class=fill style="width:0%"></div></div><small>Vorbereitet · noch nicht aktiv</small></div><strong>–</strong></div></div>`;let x=[...files].filter(f=>f.status==='done'),archiveBytes=x.reduce((a,f)=>a+Number(f.output_size||0),0);const archive=state.settings?.archive||{},direction=archive.sort_direction==='asc'?1:-1,recorded=f=>Number(f.recorded_at)||Date.parse(f.recorded_at)||Number(f.id)||0,group=f=>/^hdz_/i.test(f.name||f.output.split('/').pop())?'hdzero':String(f.output||'').includes('pc-fpv')?'pict_old':'pict_new',rank=f=>{let i=(archive.group_order||[]).indexOf(group(f));return i<0?(archive.group_order||[]).length:i};x.sort((a,b)=>rank(a)-rank(b)||direction*((archive.sort_by==='name'?String(a.name||'').localeCompare(String(b.name||'')):archive.sort_by==='recorded_at'?recorded(a)-recorded(b):a.id-b.id)||a.id-b.id));count.textContent=`(${x.length} Videos · ${fmt(archiveBytes)})`;let key=x.map(f=>`${f.id}:${f.output_size||0}:${f.flight_duration}:${JSON.stringify(f.skip_intervals||[])}`).join('|');if(key!==lastGalleryKey){lastGalleryKey=key;gallery.innerHTML=x.length?x.map(f=>{let rel=f.output.split('/library/')[1]||'',skips=f.skip_intervals??skipMap[rel]??[],encoded=encodeURIComponent(JSON.stringify(skips));return `<article class=video><div class=thumb>${f.thumb_url?`<img loading=lazy src="${f.thumb_url}">`:'<span>▶</span>'}</div><div class=meta><div class=name title="${f.name}">${f.name.replace(/\.[^/.]+$/,'')}.mp4</div><div class=details>${f.flight_duration==null?dur(f.duration):(f.flight_duration===0?'0:00':dur(f.flight_duration))+' / '+dur(f.duration)} · ${fmt(f.output_size)} · MP4</div><div class=actions><button type=button data-url="${f.video_url}" data-name="${esc(f.name)}" data-skips dEventListener('change',()=>{skipPreferenceSaved=true;try{localStorage.setItem('sd-video-hub.skip-nonflight.v1',String(skipToggle.checked))}catch{}skipCurrent()});cropToggle.addEventListener('change',()=>{cropPreferenceSaved=true;try{localStorage.setItem('sd-video-hub.crop-4-3.v1',String(cropToggle.checked))}catch{}applyCrop()});function updateCropInsets(){const ratio=player.videoWidth/player.videoHeight,target=4/3;if(!Number.isFinite(ratio)||ratio<=0)return;const horizontal=ratio>target?(1-target/ratio)*50:0,vertical=ratio<target?(1-ratio/target)*50:0;player.style.setProperty('--crop43-inset',vertical+'% '+horizontal+'%')}player.addEventListener('loadedmetadata',updateCropInsets);player.addEventListener('resize',updateCropInsets);function syncNativeFullscreen(){updateCropInsets();viewer.classList.toggle('native-fullscreen',document.fullscreenElement===player||document.webkitFullscreenElement===player||player.webkitDisplayingFullscreen===true)}document.addEventListener('fullscreenchange',syncNativeFullscreen);document.addEventListener('webkitfullscreenchange',syncNativeFullscreen);player.addEventListener('webkitbeginfullscreen',()=>{updateCropInsets();viewer.classList.add('native-fullscreen')});player.addEventListener('webkitendfullscreen',()=>viewer.classList.remove('native-fullscreen'));player.addEventListener('loadedmetadata',skipCurrent);player.addEventListener('canplay',skipCurrent);player.addEventListener('timeupdate',skipCurrent);player.addEventListener('seeking',skipCurrent);player.addEventListener('seeked',skipCurrent);setInterval(skipCurrent,250);document.getElementById('viewer').addEventListener('click',e=>{if(e.target===e.currentTarget)closeViewer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});window.addEventListener('popstate',()=>closeViewer(true));function closeViewer(fromHistory=false){viewer.classList.remove('native-fullscreen');player.pause();player.removeAttribute('src');player.load();activeSkips=[];document.getEle
